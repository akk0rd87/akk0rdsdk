name: Build
run-name: Build 🚀
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S utests -B utests/build && cmake --build utests/build && ctest --test-dir utests/build

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # на runner нет dev-пакетов X11/Wayland, без которых SDL3 не конфигурируется; проверяем только сборку исходников SDL
      - run: cmake -S libraries/SDL/SDL -B libraries/SDL/SDL/build -DSDL_UNIX_CONSOLE_BUILD=ON && cmake --build libraries/SDL/SDL/build

  build-googlePlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Run gradle build
        run: |
          chmod +x ci/proj.android/gradlew
          export AKKORD_SDK_HOME=${GITHUB_WORKSPACE}
          ci/proj.android/gradlew --no-daemon app:assembleGooglePlayRelease -p ci/proj.android

  build-ruStore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Run gradle build
        run: |
          chmod +x ci/proj.android/gradlew
          export AKKORD_SDK_HOME=${GITHUB_WORKSPACE}
          ci/proj.android/gradlew --no-daemon app:assembleRuStoreRelease -p ci/proj.android

  # Десктопное CI-приложение (ci/proj.desktop, тот же main.cpp, что у Android): на macOS — GPU-рендерер (Metal)
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          export AKKORD_SDK_HOME=${GITHUB_WORKSPACE}
          cmake -S ci/proj.desktop -B build-desktop -DCMAKE_BUILD_TYPE=Release
          cmake --build build-desktop -j 4

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          export AKKORD_SDK_HOME="${GITHUB_WORKSPACE}"
          cmake -S ci/proj.desktop -B build-desktop
          cmake --build build-desktop --config Release -j 4

  # Пустые iOS-приложения с зависимостями приложений на SDK (ci/proj.ios): CiTest — как SwiftUI-приложения,
  # CiTestSDL — как SDL-приложения; код SDK компилируется и линкуется со Swift-пакетами из tools/ios/akkord_packages.yml
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Самый новый установленный Xcode: готовые бинарники пакетов (YandexMobileAds 8.6) собраны Swift из Xcode 26
      # и не линкуются более старым (в Xcode 16 нет swift_coroFrameAlloc)
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          case "$(xcodebuild -version | head -n 1)" in
            "Xcode 2"[6-9]*) ;;
            *) echo "::error::Xcode 26 or newer is required by the packages (installed: $(xcodebuild -version | head -n 1))"; exit 1 ;;
          esac
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ci/proj.ios
        run: |
          export AKKORD_SDK_HOME=${GITHUB_WORKSPACE}
          ./generate.sh
      - name: Build for simulator
        working-directory: ci/proj.ios
        run: |
          xcodebuild build -project CiTest.xcodeproj -scheme CiTest -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E 'error:|Undefined symbols|ld: |CMake Error|PhaseScriptExecution' -A 6 build.log | head -n 80; tail -n 20 build.log; exit 1; }
      - name: Build for device
        working-directory: ci/proj.ios
        run: |
          xcodebuild build -project CiTest.xcodeproj -scheme CiTest -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E 'error:|Undefined symbols|ld: |CMake Error|PhaseScriptExecution' -A 6 build.log | head -n 80; tail -n 20 build.log; exit 1; }
      # SDL3 собирается из исходников SDK таргетом SDL3 проекта (tools/ios/akkord_sdl.yml, CMake)
      - name: Build SDL app for simulator
        working-directory: ci/proj.ios
        run: |
          xcodebuild build -project CiTest.xcodeproj -scheme CiTestSDL -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E 'error:|Undefined symbols|ld: |CMake Error|PhaseScriptExecution' -A 6 build.log | head -n 80; tail -n 20 build.log; exit 1; }
      - name: Build SDL app for device
        working-directory: ci/proj.ios
        run: |
          xcodebuild build -project CiTest.xcodeproj -scheme CiTestSDL -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E 'error:|Undefined symbols|ld: |CMake Error|PhaseScriptExecution' -A 6 build.log | head -n 80; tail -n 20 build.log; exit 1; }
