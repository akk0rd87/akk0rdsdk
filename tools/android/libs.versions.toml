[versions]
kotlin                             = '2.4.20'
firebaseBom                        = "34.18.0"
rustoreBom                         = "2026.10.01"

[libraries]
getkeepsafe-relinker               = "com.getkeepsafe.relinker:relinker:1.4.5"
junit                              = "junit:junit:4.13.2"  # юнит-тесты на JVM (framework/billing/*_test)

firebase-bom                       = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
rustore-bom                        = { module = "ru.rustore.sdk:bom", version.ref = "rustoreBom" }
firebase-analytics                 = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics               = { module = "com.google.firebase:firebase-crashlytics" }
firebase-crashlytics-ndk           = { module = "com.google.firebase:firebase-crashlytics-ndk" }

admobads                           = "com.google.android.gms:play-services-ads:25.4.0"
# Медиация AdMob: Unity Ads (bidding).
# при обновлении AdMob брать адаптер, собранный под ту же версию. Согласие GDPR из UMP адаптер передаёт сам
admob-mediation-unity              = "com.google.ads.mediation:unity:4.20.1.0"
unity-ads                          = "com.unity3d.ads:unity-ads:4.20.1"
google-play-billing                = "com.android.billingclient:billing:9.1.0"
google-play-review                 = "com.google.android.play:review:2.0.2"
google-app-update                  = "com.google.android.play:app-update:2.1.0"

play-services-games                = "com.google.android.gms:play-services-games-v2:21.0.0"
play-services-auth                 = "com.google.android.gms:play-services-auth:21.6.0"
play-appset                        = "com.google.android.gms:play-services-appset:16.1.0"

user_messaging_platform            = "com.google.android.ump:user-messaging-platform:4.0.0"
yandexadssdk                       = "com.yandex.android:mobileads:8.6.0"
# MyTarget (mobileads-mytarget) is out: its mytracker-sdk asks for com.android.billingclient:billing in a range
# [9.1.0, 10.0.0), so every game got Google's billing library whether it sold anything or not. (This note once said
# billing 9.2.0 needed core library desugaring: there is no 9.2.0, and billing 9.1.0 builds without desugaring -
# checked 2026-11-27.)
yandex-mediation-vungle            = "com.yandex.ads.mediation:mobileads-vungle:7.7.8.1"
# Mintegral SDK (com.mbridge.msdk.oversea) тянется транзитивно из репозитория Mintegral, см. ci/proj.android/build.gradle
yandex-mediation-mintegral         = "com.yandex.ads.mediation:mobileads-mintegral:17.1.81.1"

rustore-appreview                  = { module = "ru.rustore.sdk:review" }
rustore-appupdate                  = { module = "ru.rustore.sdk:appupdate" }
rustore-billing                    = { module = "ru.rustore.sdk:billingclient" }
rustore-pay                        = { module = "ru.rustore.sdk:pay" }

# Huawei AppGallery: проверка обновления (HMS JOS AppUpdateClient); репозиторий https://developer.huawei.com/repo/
huawei-appservice                  = "com.huawei.hms:appservice:6.16.2.300"
# Покупки в AppGallery: HMS IAP Kit (framework/billing/huawei)
huawei-iap                         = "com.huawei.hms:iap:6.16.6.305"
# Покупки в Galaxy Store: Samsung IAP SDK из Maven Central (framework/billing/samsung; раньше - AAR с сайта Samsung)
samsung-iap                        = "com.samsung.developer:iap:6.5.2"

[plugins]
android-application                = { id = 'com.android.application', version = '9.2.1' }
google-services                    = { id = 'com.google.gms.google-services', version = '4.4.4' }
firebase-crashlytics               = { id = 'com.google.firebase.crashlytics', version = '3.0.7' }
kotlin                             = { id = 'org.jetbrains.kotlin.android', version.ref = 'kotlin' }
kotlin-compose                     = { id = 'org.jetbrains.kotlin.plugin.compose', version.ref = 'kotlin' }
triplet-play-publisher             = { id = 'com.github.triplet.play', version = '4.0.0' }

[bundles]
admob                              = ['admobads', 'admob-mediation-unity', 'unity-ads']
yandexads                          = ['yandexadssdk']
yandexads-bidding                  = ['yandex-mediation-vungle', 'yandex-mediation-mintegral']
rustore-billing                    = ['rustore-billing']