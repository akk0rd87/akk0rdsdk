# CI-проект: пустые iOS-приложения с теми же зависимостями Akkord SDK, что у iOS-приложений на нём.
# Проверяет, что код SDK компилируется и линкуется со Swift-пакетами из tools/ios/akkord_packages.yml.
#
#   CiTest    — как SwiftUI-приложения (proj.ios_swift в JCross): провайдеры рекламы AdMob и Yandex, GDPR (UMP),
#               Firebase, libharu. Собирается для симулятора и устройства.
#   CiTestSDL — как SDL-приложения (proj.ios игр): шаблон AkkordSDLApp из tools/ios/akkord_sdl.yml, тот же, что
#               у игр; main — общий с Android CI (ci/proj.android/src/main.cpp). SDL3 собирается из исходников
#               SDK таргетом SDL3 шаблона (build/sdl/<платформа>).
#
#   export AKKORD_SDK_HOME=<корень SDK>
#   cd ci/proj.ios && ./generate.sh
#   xcodebuild build -project CiTest.xcodeproj -scheme CiTest -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
#   xcodebuild build -project CiTest.xcodeproj -scheme CiTestSDL -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
include:
  - path: ${AKKORD_SDK_HOME}/tools/ios/akkord_sdl.yml
  - path: ${AKKORD_SDK_HOME}/tools/ios/akkord_packages.yml
name: CiTest
options:
  bundleIdPrefix: org.akkord
  # ios_deployment_target из tools/ios/pods.yml (generate.sh): минимальная iOS приложений на SDK
  deploymentTarget:
    iOS: "${AKKORD_IOS_DEPLOYMENT_TARGET}"
targets:
  CiTest:
    type: application
    platform: iOS
    templates: [AkkordPackages]
    sources:
      - path: src
      # Тот же набор исходников SDK, что в proj.ios_swift/project.yml JCross
      - path: ${AKKORD_SDK_HOME}/framework/gdpr/ios/GDPRConsentPolicyManager.mm
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/firebase/analytics/ios/iosfirebaseanalytics.mm
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/configmanager.cpp
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/ads/admob/ios/impladmobios.mm
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/ads/admob/ios/admobfactory.cpp
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/ads/yandex/ios/implyandexadsios.mm
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/framework/ads/yandex/ios/yandexadsfactory.cpp
        buildPhase: sources
      - path: ${AKKORD_SDK_HOME}/libraries/libharu/src
        includes:
          - "hpdf*.c"
        buildPhase: sources
    info:
      path: Generated/Info.plist
      properties:
        # Тестовые идентификаторы Google: приложение в CI не запускается, но AdMob требует ключ в Info.plist
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.akkord.citest
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        AKKORD_SDK_HOME: ${AKKORD_SDK_HOME}
        HEADER_SEARCH_PATHS: $(AKKORD_SDK_HOME)/framework $(AKKORD_SDK_HOME)/libraries $(AKKORD_SDK_HOME)/libraries/libharu/out/build/iOS/include $(AKKORD_SDK_HOME)/libraries/libharu/include $(AKKORD_SDK_HOME)/libraries/libharu/src $(inherited)
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_MODULES: "YES"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  CiTestSDL:
    templates: [AkkordSDLApp, AkkordPackages]
    sources:
      - path: ../proj.android/src/main.cpp
        buildPhase: sources
      - path: src/SwiftRuntime.swift
        buildPhase: sources
    info:
      path: Generated/InfoSDL.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.akkord.citestsdl
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
